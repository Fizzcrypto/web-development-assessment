<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Understanding JavaScript</title>
</head>
<body>
    <h1>Activity 10 - Task 3</h1>
    <p>Enter your name in the prompt and click OK.</p>
    <p id="result"></p>

    <script type="text/javascript">
        var username = prompt("Please enter your name");

        if (username !== null) {
            var message = "Hello, " + username + ". Your name has";
            var nameLen = username.length;

            if (nameLen > 5) {
                message = message + " more than";
            } else if (nameLen < 5) {
                message = message + " less than";
            } else {
                message = message + " exactly";
            }

            message = message + " 5 characters.";
            alert(message);
            document.getElementById("result").textContent = message;
        } else {
            document.getElementById("result").textContent =
                "No name was entered. Click Try again to start.";
        }
    </script>

    <p><a href="activity10_task3.html">Try again</a></p>
</body>
</html>
