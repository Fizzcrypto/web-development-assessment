<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Timetable</title>
  <style>
    body { font-family: Arial; background-color: #f2f2f2; }
    table { border-collapse: collapse; background-color: white; }
    th, td { border: 1px solid #555555; padding: 12px; }
    th { background-color: #dddddd; }
    caption { caption-side: top; padding: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <p>Sample days, times and lecturer names.</p>
  <table>
    <caption>Weekly Class Timetable</caption>
    <tr>
      <th scope="col">Day</th>
      <th scope="col">9 am to 11 am</th>
      <th scope="col">11 am to 1 pm</th>
      <th scope="col">2 pm to 4 pm</th>
    </tr>
    <tr>
      <th scope="row">Monday</th>
      <td>Ms Ali</td><td>Mr Khan</td><td>No class</td>
    </tr>
    <tr>
      <th scope="row">Tuesday</th>
      <td>Ms Silva</td><td>No class</td><td>Ms Ali</td>
    </tr>
    <tr>
      <th scope="row">Wednesday</th>
      <td>Mr Khan</td><td>Ms Silva</td><td>No class</td>
    </tr>
    <tr>
      <th scope="row">Thursday</th>
      <td>No class</td><td>Ms Ali</td><td>Mr Khan</td>
    </tr>
    <tr>
      <th scope="row">Friday</th>
      <td>Ms Silva</td><td>No class</td><td>No class</td>
    </tr>
  </table>
</body>
</html>
