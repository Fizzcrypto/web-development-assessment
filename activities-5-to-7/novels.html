<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Novel Table</title>
  <style>
    body { font-family: Arial; background-color: #f2f2f2; }
    table { border-collapse: collapse; background-color: #ffcccc; }
    table, th, td { border: 2px solid blue; }
    th, td { padding: 12px; }
    th { font-weight: bold; text-align: center; }
    caption { caption-side: bottom; padding: 12px; }
  </style>
</head>
<body>
  <table>
    <caption>Favourite Novels</caption>
    <tr>
      <th scope="row">The Hobbit</th>
      <td>J. R. R. Tolkien</td><td>Fantasy</td>
    </tr>
    <tr>
      <th scope="row">Pride and Prejudice</th>
      <td>Jane Austen</td><td>Romance</td>
    </tr>
    <tr>
      <th scope="row">Treasure Island</th>
      <td>Robert Louis Stevenson</td><td>Adventure</td>
    </tr>
    <tr>
      <th scope="row">Nineteen Eighty-Four</th>
      <td>George Orwell</td><td>Dystopian fiction</td>
    </tr>
    <tr>
      <th scope="row">To Kill a Mockingbird</th>
      <td>Harper Lee</td><td>Literary fiction</td>
    </tr>
  </table>
</body>
</html>
