<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday List</title>
  <style>
    body { font-family: Arial; background-color: #f2f2f2; }
    table { border-collapse: collapse; background-color: white; }
    th, td { border: 1px solid #555555; padding: 12px; }
    th { background-color: #dddddd; }
  </style>
</head>
<body>
  <p>Sample names and birthdays for this exercise.</p>
  <table>
    <tr>
      <th colspan="2">Birthday List</th>
    </tr>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Birthday</th>
    </tr>
    <tr>
      <td>Ali</td>
      <td>12 March</td>
    </tr>
    <tr>
      <td>Sara</td>
      <td>8 July</td>
    </tr>
    <tr>
      <td>Hasan</td>
      <td>21 November</td>
    </tr>
  </table>
</body>
</html>
