<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy Expenditures</title>
  <style>
    body { font-family: Arial; color: #405176; }
    table { border-collapse: collapse; }
    caption { padding: 12px; font-weight: bold; }
    th, td { border: 1px solid #bbbbbb; padding: 8px; }
    th { background-color: #e9edf5; }
    .left { text-align: left; }
    .region { vertical-align: top; }
    td { text-align: right; color: #444444; }
  </style>
</head>
<body>
  <table>
    <caption>Energy Expenditures for Each Region<br>
      (millions of dollars)</caption>
    <tr>
      <th colspan="2" rowspan="4"></th>
      <th colspan="2">Type</th>
    </tr>
    <tr>
      <th>Residential Customers</th><th>Business Customers</th>
    </tr>
    <tr>
      <th>Expenditures</th><th>Expenditures</th>
    </tr>
    <tr>
      <th>Sum</th><th>Sum</th>
    </tr>
    <tr>
      <th class="left">Region</th><th class="left">Division</th>
      <td></td><td></td>
    </tr>
    <tr>
      <th rowspan="2" class="left region">Northeast</th>
      <th class="left">New England</th>
      <td>$7,477</td><td>$5,129</td>
    </tr>
    <tr>
      <th class="left">Middle Atlantic</th>
      <td>$19,379</td><td>$15,078</td>
    </tr>
    <tr>
      <th rowspan="2" class="left region">West</th>
      <th class="left">Mountain</th>
      <td>$5,476</td><td>$4,729</td>
    </tr>
    <tr>
      <th class="left">Pacific</th>
      <td>$13,959</td><td>$12,619</td>
    </tr>
  </table>
</body>
</html>
