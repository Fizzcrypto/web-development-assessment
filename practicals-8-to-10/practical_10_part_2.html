<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Loop Example</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px;
           background-color: #eeeeee; color: #222222; }
  </style>
</head>
<body>
<h1>For Loop Example</h1>
<script>
  for (var i = 0; i < 5; i++) {
    document.write(i + "<br>");
  }
</script>
</body>
</html>
