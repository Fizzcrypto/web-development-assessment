<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Spanning Rows and Columns</title>
  <style type="text/css">
    body { font-family: Arial, sans-serif; margin: 30px;
           background-color: #eeeeee; color: #222222; }
  </style>
</head>
<body>
<h1>Spanning Rows and Columns</h1>
<table border="1" cellpadding="8" cellspacing="0">
  <caption>Example Study Sessions</caption>
  <tr>
    <th rowspan="2">Day</th>
    <th colspan="2">Study Session</th>
  </tr>
  <tr>
    <th>Subject</th><th>Time</th>
  </tr>
  <tr>
    <td rowspan="2">Monday</td><td>HTML</td><td>1 hour</td>
  </tr>
  <tr>
    <td>CSS</td><td>1 hour</td>
  </tr>
  <tr>
    <td>Tuesday</td><td>JavaScript</td><td>1 hour</td>
  </tr>
</table>
</body>
</html>
