<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Newsletter Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px;
           background-color: #eeeeee; color: #222222; }
  </style>
</head>
<body>
<h1>Newsletter Form</h1>
<p>Practice form only. Use made-up details.</p>
<form onsubmit="alert('Practice form completed.'); return false;">

  <p>
    <label for="email">Email address</label><br>
    <input type="text" id="email" name="email" required>
  </p>

  <p>
    <input type="submit" value="Subscribe">
    <input type="reset" value="Reset">
  </p>
</form>
</body>
</html>
